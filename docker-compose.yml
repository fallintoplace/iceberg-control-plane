services:
  iceberg-rest:
    image: apache/iceberg-rest-fixture:latest
    ports:
      - "127.0.0.1:8181:8181"
    volumes:
      - iceberg-data:/tmp

  iceberg-go-worker:
    build:
      context: ./workers/iceberg-go
    depends_on:
      iceberg-rest:
        condition: service_healthy
    environment:
      ICEBERG_GO_CATALOGS_JSON: '[{"id":"local","uri":"http://iceberg-rest:8181"}]'
      ICEBERG_GO_WORKER_TOKEN: "${ICEBERG_GO_WORKER_TOKEN:-}"
      ICEBERG_GO_WORKER_VERSION: "0.1.0"
    ports:
      - "127.0.0.1:8090:8090"
    restart: unless-stopped
    user: "1000:1000"
    volumes:
      - iceberg-data:/tmp

volumes:
  iceberg-data:
